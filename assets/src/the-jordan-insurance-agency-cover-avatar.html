<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Show cover, avatar version — 3000x3000. Matches the episode thumbnail layout so show + episodes look like one system. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:3000px; height:3000px; font-family:"Inter","Inter Display",sans-serif; overflow:hidden; }
  .c { position:relative; width:3000px; height:3000px; background:#163A70; overflow:hidden; color:#fff; }
  .photo { position:absolute; top:0; right:-900px; height:2440px; }
  .shade { position:absolute; inset:0; background:linear-gradient(90deg, #163A70 0%, #163A70 38%, rgba(22,58,112,.8) 52%, rgba(22,58,112,0) 72%); }
  .kicker { position:absolute; left:190px; top:260px; font-weight:800; font-size:100px; letter-spacing:10px; color:#E0B43B; text-transform:uppercase; }
  .title { position:absolute; left:180px; top:470px; font-family:"Inter Display","Inter",sans-serif; font-weight:900; font-size:330px; line-height:.97; letter-spacing:-10px; }
  .title .gold { color:#E0B43B; }
  .sub { position:absolute; left:190px; top:1850px; width:1500px; font-weight:700; font-size:110px; line-height:1.22; color:#E9EDF2; }
  .panel { position:absolute; left:0; right:0; bottom:0; height:560px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .panel::before { content:""; position:absolute; top:0; left:0; right:0; height:30px; background:#E0B43B; }
  .panel img { width:1500px; }
</style></head>
<body><div class="c">
  <img class="photo" src="the-jordan-insurance-agency-cover-1184x666.jpg" alt="">
  <div class="shade"></div>
  <div class="kicker">The Insurance Podcast</div>
  <div class="title">Smart<br>Coverage.<br><span class="gold">Real<br>Advice.</span></div>
  <div class="sub">with Billy Jordan</div>
  <div class="panel"><img src="the-jordan-insurance-agency-logo-cropped.png" alt="The Jordan Insurance Agency"></div>
</div></body></html>
